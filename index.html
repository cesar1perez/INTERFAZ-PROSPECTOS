<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CRM PROSPECCIÓN LLANTERAMA</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<!-- FIX: se definen los colores/fuentes para que las clases de Tailwind sí pinten -->
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { marino: '#001529', mostaza: '#facc15' },
      fontFamily: { orbitron: [Arial, Helvetica, sans-serif,'sans-serif'], mono: [Arial, Helvetica, sans-serif,'monospace'] }
    }}
  };
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

<style>
  :root { --marino:#001529; --mostaza:#facc15; --marino2:#012a4a; --linea:#e5eaf1; }
  * { -webkit-tap-highlight-color: transparent; box-sizing:border-box; }
  body, button, input, select, textarea, table {
    font-family:Arial, Helvetica, sans-serif; }
  body { background:#eef2f7; color:#0f172a; overflow-x:hidden; font-size:13px; }
  .orb { font-family:Arial, Helvetica, sans-serif; }
  /* Contenedor: en compu no se estira de lado a lado */
  .wrap { max-width:1080px; margin:0 auto; width:100%; }

  /* HOME */
  .home-container { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 0%, var(--marino2), var(--marino) 70%); position:fixed; inset:0; z-index:1000; padding:24px 20px; overflow:hidden; }
  .home-bg { position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(circle at 18% 12%, rgba(250,204,21,.10), transparent 42%),
      radial-gradient(circle at 85% 82%, rgba(37,99,235,.20), transparent 46%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:100% 100%, 100% 100%, 28px 28px, 28px 28px; }
  .home-watermark { position:absolute; right:-8vw; bottom:-10vh; font-size:58vh; font-weight:900; font-style:italic;
    color:rgba(250,204,21,.035); line-height:1; pointer-events:none; user-select:none; }
  .home-inner { position:relative; z-index:2; width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; }
  .logo-ll { width:100px; height:100px; border:5px solid var(--mostaza); display:flex; align-items:center; justify-content:center;
    border-radius:26px; box-shadow:0 0 44px rgba(250,204,21,.3); }
  .logo-ll span { color:var(--mostaza); font-size:56px; font-style:italic; font-weight:900; }
  .title-accent { width:52px; height:4px; background:var(--mostaza); border-radius:4px; margin:11px 0 5px; }
  .home-stat { background:rgba(255,255,255,.07); border:1px solid rgba(250,204,21,.35); color:#fff; padding:7px 16px;
    border-radius:40px; font-size:12px; font-weight:700; margin:18px 0 26px; }
  .home-stat b { color:var(--mostaza); }

  .nav-card { position:relative; background:#fff; padding:17px; border-radius:18px; width:100%; display:flex; align-items:center; gap:15px;
    margin-bottom:13px; box-shadow:0 8px 0 #00060f; transition:.08s; border:none; text-align:left; }
  .nav-card:active { transform:translateY(5px); box-shadow:0 3px 0 #00060f; }
  .nav-card .ico { width:54px; height:54px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .nav-card .txt { flex:1; }
  .nav-card .txt b { display:block; color:var(--marino); font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; }
  .nav-card .txt small { color:#64748b; font-size:11px; font-weight:600; }
  .nav-card .chev { color:#cbd5e1; font-size:18px; }
  .home-footer { position:relative; z-index:2; margin-top:24px; text-align:center; color:rgba(255,255,255,.5);
    font-size:9.5px; font-weight:600; line-height:1.7; letter-spacing:.4px; }

  /* VISTAS */
  .view-section { display:none; min-height:100vh; }
  .active-view { display:block !important; }
  .header-app { background:var(--marino); color:#fff; padding:9px 12px; display:flex; align-items:center; gap:11px;
    border-bottom:3px solid var(--mostaza); position:sticky; top:0; z-index:500; }
  .header-app .title { font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.8px; }
  .btn-inicio { background:var(--mostaza); color:var(--marino); padding:6px 13px; border-radius:8px; font-weight:800; font-size:11.5px; border:none; }

  /* RESUMEN */
  .stat-card { background:#fff; border-radius:14px; padding:12px; box-shadow:0 3px 12px rgba(0,21,41,.08); border-left:8px solid var(--marino); }
  .stat-num { font-family:Arial, Helvetica, sans-serif; font-weight:900; font-size:26px; color:var(--marino); line-height:1; }
  .bar-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .bar-track { flex:1; height:22px; background:#e2e8f0; border-radius:6px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--marino); display:flex; align-items:center; padding-left:8px; color:#fff; font-weight:800; font-size:11px; }

  /* BUSCADOR (FIX: antes no tenía estilos) */
  .search-wrap { padding:9px 10px; background:var(--marino); }
  .search-input { width:100%; padding:9px 13px; border-radius:9px; border:2px solid var(--mostaza);
    font-weight:700; font-size:13px; outline:none; }

  /* FILTROS */
  .chip-bar { display:flex; gap:5px; padding:8px 10px 0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .chip-bar::-webkit-scrollbar { display:none; }
  .fchip { flex-shrink:0; background:#fff; border:1.5px solid #cbd5e1; color:#475569; padding:5px 11px; border-radius:30px;
    font-size:11px; font-weight:700; white-space:nowrap; }
  .fchip b { color:#dc2626; }
  .fchip.active { background:var(--marino); border-color:var(--marino); color:var(--mostaza); }
  .fchip.active b { color:var(--mostaza); }

  .filter-bar { display:flex; gap:6px; padding:7px 10px; flex-wrap:wrap; align-items:stretch; }
  .filter-bar select { flex:1 1 30%; min-width:100px; padding:7px 6px; border-radius:8px; border:1.5px solid #cbd5e1; background:#fff;
    font-weight:700; font-size:11.5px; color:var(--marino); }
  .btn-clear { flex:0 0 auto; padding:7px 11px; border-radius:8px; border:1.5px solid #cbd5e1; background:#fff;
    font-weight:700; font-size:11px; color:#64748b; }
  .pcount { padding:2px 12px 6px; color:#64748b; font-size:11px; font-weight:700; }

  /* LISTADO EN COLUMNAS */
  .plist { padding:0 0 30px; background:#fff; }
  .prow { display:grid; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--linea);
    grid-template-columns: 1fr auto; }
  .prow:nth-child(even) { background:#fafcfe; }
  .prow:active { background:#fffbeb; }
  .lhead { display:none; }

  .c-negocio { min-width:0; }
  .c-negocio .nom { font-weight:800; font-size:12.5px; color:var(--marino); text-transform:uppercase; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c-negocio .sub { font-size:10.5px; color:#94a3b8; font-weight:600; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cell { font-size:11px; font-weight:700; color:#334155; min-width:0; }
  .cell .mini { display:none; }
  .txt-ell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vacio { color:#cbd5e1; font-weight:600; font-style:italic; }
  .cod-ok { background:var(--marino); color:var(--mostaza); padding:1px 6px; border-radius:5px; font-size:10px; letter-spacing:.4px; }

  .asig { display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:800; padding:2px 7px; border-radius:20px; max-width:100%; }
  .asig.si { background:#dcfce7; color:#15803d; }
  .asig.no { background:#fef3c7; color:#b45309; }
  .asig span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .prod-chips { display:inline-flex; flex-wrap:wrap; gap:3px; }
  .pchip { font-size:9px; font-weight:800; padding:2px 5px; border-radius:5px; letter-spacing:.2px; }

  /* Acciones de contacto */
  .acts { display:flex; gap:5px; align-items:center; justify-content:flex-end; }
  .abtn { width:29px; height:29px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:13px; border:none; color:#fff; text-decoration:none; flex-shrink:0; }
  .abtn.wa { background:#25D366; }
  .abtn.tel { background:#1a73e8; }
  .abtn.off { background:#e2e8f0; color:#cbd5e1; }

  .vpills { display:flex; gap:3px; }
  .vpill { width:21px; height:21px; border-radius:6px; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;
    border:1.5px solid #d8e0ea; color:#94a3b8; background:#fff; flex-shrink:0; }
  .vpill.on { background:#16a34a; border-color:#16a34a; color:#fff; }

  /* MÓVIL: dos renglones compactos */
  @media (max-width:819px){
    .prow { grid-template-columns: 1fr auto; grid-template-areas:"neg acts" "det det"; row-gap:6px; }
    .c-negocio { grid-area:neg; }
    .acts { grid-area:acts; }
    .c-det { grid-area:det; display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; }
    .cell .mini { display:inline; color:#cbd5e1; font-size:9px; font-weight:700; text-transform:uppercase; margin-right:3px; }
  }
  /* ESCRITORIO: columnas reales con encabezado */
  @media (min-width:820px){
    .prow { grid-template-columns: 2.1fr 1fr 1.2fr 1.3fr 1.5fr .9fr auto auto; padding:8px 14px; }
    .c-det { display:contents; }
    .lhead { display:grid; grid-template-columns: 2.1fr 1fr 1.2fr 1.3fr 1.5fr .9fr auto auto; gap:8px; padding:9px 14px;
      background:var(--marino); color:var(--mostaza); font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
      position:sticky; top:0; z-index:20; }
    .lhead span:nth-last-child(-n+2) { text-align:right; }
  }

  /* RESUMEN DESPLEGABLE (dentro de Prospectos) */
  .res-toggle { width:100%; background:linear-gradient(90deg, var(--marino2), var(--marino)); color:#fff; border:none;
    border-bottom:3px solid var(--mostaza); padding:13px 16px; display:flex; justify-content:space-between; align-items:center;
    font-family:inherit; font-weight:800; font-size:13px; }
  .res-toggle-l { display:flex; align-items:center; gap:11px; text-align:left; }
  .res-toggle-l > i { color:var(--marino); background:var(--mostaza); width:27px; height:27px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .res-toggle-l small { display:block; font-size:9.5px; font-weight:600; color:rgba(255,255,255,.6); margin-top:1px; text-transform:none; }
  #resChev { color:var(--mostaza); }
  .res-body { display:none; background:#e8edf4; padding:8px; }
  .res-body.open { display:block; }
  .res-block { background:#fff; border-radius:10px; padding:9px 11px; margin-bottom:7px; box-shadow:0 2px 8px rgba(0,21,41,.06); }
  .res-block h4 { font-size:11px; font-weight:800; color:var(--marino); text-transform:uppercase; letter-spacing:.6px;
    padding-bottom:6px; margin-bottom:8px; border-bottom:2px solid var(--mostaza); }
  .res-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .res-row .lbl { font-size:11px; font-weight:700; color:#334155; width:104px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .res-row .track { flex:1; height:15px; background:#e2e8f0; border-radius:5px; overflow:hidden; }
  .res-row .fill { height:100%; background:var(--marino); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; padding-left:6px; }
  .res-kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:9px; }
  .kpi { background:#fff; border-radius:12px; padding:10px 8px; text-align:center; box-shadow:0 2px 8px rgba(0,21,41,.06); border-top:4px solid var(--marino); }
  .kpi b { display:block; font-size:19px; font-weight:900; color:var(--marino); line-height:1; }
  .kpi span { font-size:9px; font-weight:700; color:#64748b; text-transform:uppercase; display:block; margin-top:4px; }
  .emp-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid #eef2f7; font-size:12px; font-weight:700; color:var(--marino); }
  .emp-row b { font-size:16px; }
  .prod-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
  .prod { border-radius:11px; padding:9px; text-align:center; }
  .prod b { display:block; font-size:19px; font-weight:900; line-height:1; }
  .prod span { font-size:9.5px; font-weight:700; text-transform:uppercase; }

  /* CALENDARIO / AGENDA */
  .cal-nav { display:flex; align-items:center; justify-content:space-between; padding:12px; background:var(--marino2); }
  .cal-nav button { width:36px; height:36px; border-radius:10px; border:2px solid var(--mostaza); background:transparent; color:var(--mostaza); font-size:14px; }
  .cal-nav span { color:#fff; font-weight:800; font-size:15px; text-transform:uppercase; letter-spacing:1px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:10px; }
  .cal-dow { text-align:center; font-size:9.5px; font-weight:800; color:#94a3b8; text-transform:uppercase; padding:4px 0; }
  .cal-day { aspect-ratio:1; border-radius:9px; background:#fff; border:1.5px solid var(--linea); display:flex; flex-direction:column;
    align-items:center; justify-content:center; position:relative; font-weight:700; font-size:13px; color:#334155; }
  .cal-day.empty { background:transparent; border:none; }
  .cal-day.hoy { border-color:var(--marino); border-width:2.5px; }
  .cal-day.tiene { background:var(--marino); color:#fff; cursor:pointer; box-shadow:0 3px 8px rgba(0,21,41,.25); }
  .cal-day.tiene .cd-badge { position:absolute; top:-5px; right:-5px; background:var(--mostaza); color:var(--marino);
    min-width:19px; height:19px; border-radius:50%; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; padding:0 4px; }
  .cal-detalle { padding:4px 12px 30px; }
  .cal-cita { background:#fff; border-left:5px solid var(--marino); border-radius:10px; padding:10px 12px; margin-bottom:8px;
    box-shadow:0 2px 8px rgba(0,21,41,.07); }
  .cal-cita .neg { font-weight:800; font-size:13px; color:var(--marino); text-transform:uppercase; }
  .cal-cita .meta { font-size:11px; color:#64748b; font-weight:600; margin-top:3px; }
  .cal-vacio { text-align:center; color:#94a3b8; font-weight:700; padding:24px; font-size:12px; }

  /* MAPA: leyenda + acordeón de zonas */
  .legend { padding:10px 12px; display:flex; flex-wrap:wrap; gap:8px 12px; background:#fff; border-bottom:3px solid var(--mostaza); position:sticky; top:0; z-index:2; }
  .legend .chip { display:flex; align-items:center; gap:5px; font-size:10px; font-weight:800; color:#334155; text-transform:uppercase; }
  .legend .dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .zona-head { width:100%; background:#f1f5f9; color:var(--marino); padding:12px 14px; font-weight:800; font-size:12px; text-transform:uppercase;
    border:none; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .zona-head:active { background:#e2e8f0; }
  .zona-body { display:none; }
  .zona-body.open { display:block; }

  /* TABLA */
  table { border-collapse:separate; border-spacing:0; }
  th { background:var(--marino); color:var(--mostaza); font-family:Arial, Helvetica, sans-serif; font-size:10px; text-transform:uppercase; letter-spacing:.5px;
    padding:12px 8px; cursor:pointer; position:sticky; top:112px; z-index:300; user-select:none; }
  th:hover { background:var(--marino2); }
  .row-card td { padding:12px 8px; font-size:12px; font-weight:600; border-bottom:1px solid #e2e8f0; }
  .row-card:active { background:#fffbeb; }

  .badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:10px; font-weight:800; text-transform:uppercase; white-space:nowrap; }

  /* MAPA */
  .map-layout { display:flex; height:calc(100vh - 64px); position:relative; }
  .sidebar-map { width:330px; background:#fff; border-right:4px solid var(--marino); overflow-y:auto; }
  #map { flex-grow:1; z-index:10; }
  .btn-toggle-list { display:none; position:absolute; top:14px; left:14px; z-index:1100; background:var(--marino); color:var(--mostaza);
    padding:11px 20px; border-radius:12px; font-weight:800; border:3px solid var(--mostaza); box-shadow:0 4px 12px rgba(0,0,0,.35); font-size:12px; }
  @media (max-width:768px){
    .sidebar-map { position:absolute; bottom:0; left:0; width:100%; height:72%; z-index:1000; transform:translateY(100%);
      transition:.4s; border-top:5px solid var(--mostaza); border-right:none; }
    .sidebar-map.open { transform:translateY(0); }
    .btn-toggle-list { display:block !important; }
  }
  .leaflet-popup-content-wrapper { border-radius:12px; border:2px solid var(--marino); }
  .popup-title { font-family:Arial, Helvetica, sans-serif; font-size:12px; font-weight:800; color:var(--marino); text-transform:uppercase; text-align:center; }
  .popup-sub { font-size:10px; font-weight:700; color:#64748b; text-align:center; margin:2px 0 8px; border-bottom:1px solid #eee; padding-bottom:4px; }

  /* PANEL FICHA / CRM */
  #detailPanel { position:fixed; top:0; right:0; height:100%; width:100%; max-width:460px; background:#f4f7fb; z-index:2000;
    transform:translateX(100%); transition:.35s cubic-bezier(.4,0,.2,1); border-left:8px solid var(--mostaza); box-shadow:-12px 0 44px rgba(0,0,0,.4); }
  .panel-open { transform:translateX(0) !important; }
  .panel-head { background:var(--marino); color:#fff; padding:13px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .panel-head h2 { font-family:Arial, Helvetica, sans-serif; font-weight:800; font-size:16px; text-transform:uppercase; line-height:1.15; }
  .sec-title { font-weight:800; font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--marino);
    margin:18px 0 8px; padding-bottom:5px; border-bottom:2px solid var(--mostaza); }
  .field { padding:7px 0; border-bottom:1px solid #e6ebf2; }
  .field .k { font-size:9px; color:#94a3b8; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .field .v { font-size:14px; color:var(--marino); font-weight:700; line-height:1.25; }

  .visita-card { background:#fff; border-radius:12px; padding:10px; margin-bottom:9px; box-shadow:0 3px 10px rgba(0,21,41,.07); border-left:6px solid var(--marino); }
  .visita-card.tiene { border-left-color:#16a34a; }
  .visita-label { font-family:Arial, Helvetica, sans-serif; font-weight:800; font-size:12px; color:var(--marino); text-transform:uppercase; }
  .visita-txt { width:100%; min-height:62px; border:2px solid #e2e8f0; border-radius:10px; padding:9px; font-family:Arial, Helvetica, sans-serif;
    font-size:13px; font-weight:600; resize:vertical; outline:none; margin-top:6px; }
  .visita-txt:focus { border-color:var(--mostaza); }
  .cita-row { display:flex; align-items:center; gap:7px; margin-top:9px; padding-top:9px; border-top:1px dashed #e2e8f0; }
  .cita-row > i { color:var(--marino); font-size:13px; }
  .cita-lbl { font-size:11px; font-weight:800; color:#64748b; text-transform:uppercase; letter-spacing:.3px; }
  .cita-input { flex:1; padding:7px 9px; border:2px solid #cbd5e1; border-radius:9px; font-family:inherit; font-weight:700;
    font-size:12.5px; color:var(--marino); outline:none; }
  .cita-input:focus { border-color:var(--mostaza); }
  .cita-clear { width:30px; height:30px; border-radius:8px; border:none; background:#fee2e2; color:#b91c1c; font-size:12px; flex-shrink:0; }
  .btn-mic, .btn-save { border:none; border-radius:10px; padding:9px 12px; font-weight:800; font-size:12px; cursor:pointer; }
  .btn-mic { background:#e2e8f0; color:var(--marino); }
  .btn-mic.rec { background:#dc2626; color:#fff; animation:pulse 1s infinite; }
  .btn-save { background:var(--marino); color:var(--mostaza); flex:1; }
  .btn-save:disabled { opacity:.5; }
  @keyframes pulse { 50% { opacity:.55; } }

  .btn-gmaps { background:#1a73e8; color:#fff; padding:12px; border-radius:12px; font-weight:800; font-size:13px; border:none;
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px; }

  .status-select { width:100%; padding:11px; border-radius:11px; border:3px solid var(--marino); font-family:Arial, Helvetica, sans-serif;
    font-weight:800; font-size:14px; background:#fff; color:var(--marino); }

  /* TOAST */
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120px); z-index:5000;
    padding:14px 22px; border-radius:14px; font-weight:800; font-size:13px; color:#fff; box-shadow:0 8px 24px rgba(0,0,0,.3); transition:.3s; }
  #toast.show { transform:translateX(-50%) translateY(0); }

  /* LOADER */
  #loader { position:fixed; inset:0; background:var(--marino); z-index:3000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .spin { width:46px; height:46px; border:5px solid rgba(250,204,21,.25); border-top-color:var(--mostaza); border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<script>
/* ==================================================================
   CONFIGURACIÓN
   ================================================================== */
const CONFIG = {
  // Pega aquí la URL /exec de tu Apps Script (la del archivo .gs).
  // Mientras esté vacía, el CRM LEE desde el CSV pero NO puede guardar.
  WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbzqLpVvvbf2EcoLnDSOdGvo-9AKTRtuATIr7OBja2u-ZYjD0pkAXgSZJjk7Ris1KwwpQw/exec',

  // Respaldo de lectura (tu CSV publicado actual).
  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcrymfUz61DDQ0fK90mTNnTqKHDwOm-UxSd9uUR6ZBjhCvcS6y2_xb7BF7uQtfIsWVsFcWAHvX-x8G/pub?gid=866211599&single=true&output=csv',

  // Sugerencias rápidas al asignar (se escriben en la columna AF).
  PREFIJO_ASIGNACION: 'Asignado a ',

  // Como el formulario no tiene columna de empresa, se separan por zona.
  // Escribe aquí las zonas que pertenecen a POZA RICA. Todo lo demás cuenta como TULANCINGO.
  // Ejemplo: zonasPozaRica: ['Poza Rica', 'Tihuatlán', 'Coatzintla']
  EMPRESAS: { zonasPozaRica: [] },

  // Columna AF de tu hoja (ESTATUS): ahí se escribe "Asignado a Miguel L.".
  // Si está vacía, el prospecto NO tiene vendedor asignado.
  COL_VENDEDOR: 'ESTATUS',

  // Columna AL de tu hoja: código que se captura cuando se concreta la venta.
  COL_CODIGO: 'Codigo Cliente',

  // Columnas AO–AS: fecha de cita agendada para cada visita (FECHA 1 … FECHA 5).
  COL_FECHAS: ['FECHA 1','FECHA 2','FECHA 3','FECHA 4','FECHA 5']
};

let allData = [], map, markersLayer, sortState = {};
let vendorColors = {};
const VENDOR_PALETTE = ['#dc2626','#2563eb','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#0d9488','#4f46e5','#b45309'];
function buildVendorColors(){
  const vs=[...new Set(allData.map(r=>getVal(r,'Impulsor de mercado')).filter(Boolean))].sort();
  vendorColors={}; vs.forEach((v,i)=>vendorColors[v]=VENDOR_PALETTE[i%VENDOR_PALETTE.length]);
}
function vendedorColor(v){ return vendorColors[v] || '#94a3b8'; }

/* ==================================================================
   UTILIDADES
   ================================================================== */
function isBackendOn(){ return /^https?:\/\//.test(CONFIG.WEB_APP_URL.trim()); }

function getVal(row, name){
  const key = Object.keys(row).find(k => k.toLowerCase().trim().includes(name.toLowerCase().trim()));
  const v = key ? row[key] : '';
  return (v === null || v === undefined) ? '' : v.toString().trim();
}

function parseGPS(s){
  if(!s || !s.includes(',')) return null;
  const [a,b] = s.split(',');
  const lat = parseFloat(a), lng = parseFloat(b);
  return (isNaN(lat)||isNaN(lng)) ? null : [lat,lng];
}

// FIX: el potencial venía en 3 columnas separadas; aquí se unifica.
function getPotencial(row){
  const alto  = getVal(row,'Potencial del cliente [Alto');
  const medio = getVal(row,'Potencial del cliente [Medio');
  const base  = row['Potencial del cliente'] ? String(row['Potencial del cliente']).trim() : '';
  if(alto)  return 'Alto';
  if(medio) return 'Medio';
  if(base && !base.includes('[')) return base;
  return '';
}

function potColor(p){ return p==='Alto'?'#16a34a' : p==='Medio'?'#d97706' : p==='Bajo'?'#dc2626' : '#94a3b8'; }
function potBadge(p){ const c=potColor(p); return `<span class="badge" style="background:${c}1a;color:${c}">${p||'—'}</span>`; }

function estatusColor(s){
  const t=(s||'').toLowerCase();
  if(!t) return '#d97706';                    // S/A = sin asignar estatus (ámbar, no gris)
  if(t.includes('cliente')) return '#16a34a';
  if(t.includes('seguim'))  return '#2563eb';
  if(t.includes('no')||t.includes('descart')) return '#dc2626';
  return '#64748b';
}
function estatusBadge(s){ const c=estatusColor(s); return `<span class="badge" style="background:${c}1a;color:${c}">${s||'S/A'}</span>`; }

function esc(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function toast(msg, tipo='ok'){
  const t=document.getElementById('toast');
  t.style.background = tipo==='ok' ? '#16a34a' : tipo==='error' ? '#dc2626' : '#001529';
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tT); window._tT=setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ==================================================================
   NAVEGACIÓN
   ================================================================== */
function switchView(v){
  document.getElementById('homeView').style.display = (v==='home') ? 'flex' : 'none';
  document.querySelectorAll('.view-section').forEach(s=>s.classList.remove('active-view'));
  if(v!=='home') document.getElementById(v+'View').classList.add('active-view');
  if(v==='map'){ if(!map) initMap(); setTimeout(()=>map.invalidateSize(),300); }
  if(v==='cal'){ renderCalendario(); }
  window.scrollTo(0,0);
}
function toggleMapList(){
  document.querySelector('.sidebar-map').classList.toggle('open');
  const b=document.querySelector('.btn-toggle-list');
  b.innerHTML = b.innerHTML.includes('VER') ? '<i class="fas fa-times"></i> CERRAR' : '<i class="fas fa-list"></i> VER LISTA';
}

/* ==================================================================
   CARGA DE DATOS
   ================================================================== */
function loadData(){
  Papa.parse(CONFIG.CSV_URL, {
    download:true, header:true,
    complete: res => {
      // _row = fila real en la hoja (encabezado + índice). Se calcula ANTES de filtrar.
      res.data.forEach((r,i)=> r._row = i + 2);
      // Se acepta la fila si tiene marca temporal O nombre de negocio (altas manuales).
      allData = res.data.filter(r => r['Marca temporal'] || getVal(r,'Nombre del negocio'));
      afterLoad();
    },
    error: () => { document.getElementById('loader').innerHTML =
      '<p class="text-mostaza orb font-bold text-center px-6">No se pudo cargar la hoja.<br>Revisa tu conexión e intenta de nuevo.</p>'; }
  });
}
function afterLoad(){
  buildVendorColors();
  populateFilters();
  renderResumen();
  applyFilters();
  if(map) renderMapa();
  document.getElementById('loader').style.display='none';
}

/* ==================================================================
   RESUMEN
   ================================================================== */
function toggleResumen(){
  const b=document.getElementById('resBody');
  const open=b.classList.toggle('open');
  document.getElementById('resChev').className='fas fa-chevron-'+(open?'up':'down');
}

function empresaDe(row){
  const z=getVal(row,'Zona');
  const pr=(CONFIG.EMPRESAS.zonasPozaRica||[]).map(s=>s.toLowerCase().trim());
  return pr.includes(z.toLowerCase().trim()) ? 'Poza Rica' : 'Tulancingo';
}
function mesDe(row){
  const m=getVal(row,'Mes correspondiente');
  if(m) return m;
  const t=getVal(row,'Marca temporal');           // dd/mm/aaaa
  const p=t.split(' ')[0].split('/');
  const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  if(p.length===3){ const i=parseInt(p[1],10)-1; if(i>=0&&i<12) return MESES[i]; }
  return 'Sin fecha';
}
const ORDEN_MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function esSi(v){ return /^s[ií]/i.test(String(v).trim()); }

function barras(pares, color){
  const max=Math.max(...pares.map(p=>p[1]),1);
  return pares.map(([k,v])=>`<div class="res-row"><span class="lbl" title="${esc(k)}">${esc(k)}</span>
    <div class="track"><div class="fill" style="width:${Math.max(v/max*100,13)}%;${color?'background:'+color:''}">${v}</div></div></div>`).join('');
}
function cuenta(fn){
  const o={}; allData.forEach(r=>{ const k=fn(r)||'Sin dato'; o[k]=(o[k]||0)+1; }); return o;
}

function renderResumen(){
  const total=allData.length;
  const stat=document.getElementById('homeStat');
  if(stat) stat.innerHTML=`<b>${total}</b> prospectos registrados`;

  const porVend=Object.entries(cuenta(r=>getVal(r,'Impulsor de mercado'))).sort((a,b)=>b[1]-a[1]);
  const porZona=Object.entries(cuenta(r=>getVal(r,'Zona'))).sort((a,b)=>b[1]-a[1]);
  const porEmp=cuenta(empresaDe);
  const porMesObj=cuenta(mesDe);
  const porMes=Object.entries(porMesObj).sort((a,b)=>ORDEN_MESES.indexOf(a[0])-ORDEN_MESES.indexOf(b[0]));

  const prod=[
    ['Acumuladores','¿Compra acumuladores','#2563eb'],
    ['Motobaterías','¿Compra motobaterías','#7c3aed'],
    ['Lubricantes','¿Compra lubricantes','#d97706'],
    ['Filtros','¿Compra filtros','#16a34a'],
    ['Llantas','¿Compra llanta','#dc2626'],
  ].map(([n,col,c])=>[n, allData.filter(r=>esSi(getVal(r,col))).length, c]);

  const conGps=allData.filter(r=>parseGPS(getVal(r,'GPS'))).length;
  const sinAsig=allData.filter(r=>!vendedorAsignado(r)).length;
  const porAsig=Object.entries(cuenta(r=>vendedorCorto(r)||'Sin asignar')).sort((a,b)=>b[1]-a[1]);

  document.getElementById('resBody').innerHTML=`
    <div class="res-kpis">
      <div class="kpi"><b>${total}</b><span>Prospectos</span></div>
      <div class="kpi" style="border-top-color:#2563eb"><b style="color:#2563eb">${porVend.length}</b><span>Impulsores</span></div>
      <div class="kpi" style="border-top-color:#16a34a"><b style="color:#16a34a">${porZona.length}</b><span>Zonas</span></div>
    </div>

    <div class="res-block">
      <h4>Por empresa</h4>
      <div class="emp-row"><span>Llanterama Tulancingo S.A. de C.V.</span><b>${porEmp['Tulancingo']||0}</b></div>
      <div class="emp-row" style="border:none"><span>Llanterama Poza Rica S.A. de C.V.</span><b>${porEmp['Poza Rica']||0}</b></div>
      ${(CONFIG.EMPRESAS.zonasPozaRica||[]).length ? '' :
        '<p class="text-[10px] text-red-600 font-bold mt-2">⚠ Define las zonas de Poza Rica en CONFIG.EMPRESAS para separar el conteo.</p>'}
    </div>

    <div class="res-block">
      <h4>Prospectos por impulsor</h4>
      ${barras(porVend)}
      ${sinAsig?`<p class="text-[10px] font-bold text-amber-600 mt-2">⚠ ${sinAsig} prospecto(s) sin impulsor asignado</p>`:''}
    </div>

    <div class="res-block">
      <h4>Prospectos por vendedor asignado</h4>
      ${barras(porAsig,'#16a34a')}
    </div>

    <div class="res-block">
      <h4>Prospectos por zona</h4>
      ${barras(porZona,'#0891b2')}
    </div>

    <div class="res-block">
      <h4>Prospectos por mes</h4>
      ${barras(porMes,'#7c3aed')}
    </div>

    <div class="res-block">
      <h4>Interés por línea de producto</h4>
      <div class="prod-grid">
        ${prod.map(([n,v,c])=>`<div class="prod" style="background:${c}14;color:${c}"><b>${v}</b><span>${n}</span></div>`).join('')}
        <div class="prod" style="background:#1a73e814;color:#1a73e8"><b>${conGps}</b><span>Con GPS</span></div>
      </div>
    </div>`;
}

/* ==================================================================
   LISTADO
   ================================================================== */
/* ---------- Fechas ---------- */
// La marca temporal de Forms viene como dd/mm/aaaa hh:mm:ss
function parseFecha(row){
  const t=getVal(row,'Marca temporal'); if(!t) return null;
  const [f,h] = t.split(' ');
  const p=f.split('/'); if(p.length!==3) return null;
  const [d,m,a]=p.map(n=>parseInt(n,10));
  const hh=(h||'0:0:0').split(':').map(n=>parseInt(n,10)||0);
  const dt=new Date(a, m-1, d, hh[0]||0, hh[1]||0, hh[2]||0);
  return isNaN(dt.getTime()) ? null : dt;
}
function fechaCorta(row){
  const d=parseFecha(row); if(!d) return {dia:'—', hora:''};
  const MM=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const hh=String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0');
  return { dia:`${d.getDate()} ${MM[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`, hora:`${hh}:${mi}` };
}
function esReciente(row, dias){
  const d=parseFecha(row); if(!d) return false;
  const hoy=new Date();
  if(dias==='hoy') return d.toDateString()===hoy.toDateString();
  const lim=new Date(); lim.setDate(lim.getDate()-parseInt(dias,10));
  return d>=lim;
}

/* ---------- Productos que compra ---------- */
const PRODUCTOS=[
  ['ACUM','¿Compra acumuladores','#2563eb'],
  ['MOTO','¿Compra motobaterías','#7c3aed'],
  ['LUBS','¿Compra lubricantes','#d97706'],
  ['FILT','¿Compra filtros','#16a34a'],
  ['LLTA','¿Compra llanta','#dc2626'],
];
function productosDe(row){ return PRODUCTOS.filter(([,col])=>esSi(getVal(row,col))); }
function visitasDe(row){ let n=0; for(let i=1;i<=5;i++) if(getVal(row,'VISITA '+i)) n++; return n; }

/* ---------- Listado ---------- */
function vendedorAsignado(row){ return getVal(row, CONFIG.COL_VENDEDOR); }
function vendedorCorto(row){ return vendedorAsignado(row).replace(/^asignad[oa]\s*a\s*/i,'').trim(); }
function codigoCliente(row){ return getVal(row, CONFIG.COL_CODIGO); }

/* Teléfono -> WhatsApp / llamada */
function telLimpio(row){
  const t=getVal(row,'Teléfono').replace(/\D/g,'');
  return t.length>=10 ? t : '';
}
function telWA(row){
  const t=telLimpio(row); if(!t) return '';
  return t.length===10 ? '52'+t : t;      // México: se antepone 52 si son 10 dígitos
}
function abrirWA(ev,row){
  ev.stopPropagation();
  const r=findByRow(row), n=telWA(r); if(!n) return;
  const negocio=getVal(r,'Nombre del negocio');
  const msg=encodeURIComponent(`Buen día, le saluda ${'Llanterama'}. ¿Hablo con ${negocio}?`);
  window.open(`https://wa.me/${n}?text=${msg}`,'_blank');
}

function renderListado(data){
  const cont=document.getElementById('listContainer');
  document.getElementById('pcount').textContent=`${data.length} prospecto${data.length===1?'':'s'}`;
  if(!data.length){ cont.innerHTML=`<div class="text-center p-8 text-slate-400 font-bold">Sin resultados. Ajusta los filtros.</div>`; return; }

  const head=`<div class="lhead">
    <span>Cliente / alta</span><span>Fecha</span><span>Zona</span><span>Asignado</span>
    <span>Productos</span><span>Código</span><span>Seguimiento</span><span>Contacto</span></div>`;

  const filas=data.map(row=>{
    const alta=getVal(row,'Impulsor de mercado');
    const asig=vendedorAsignado(row);
    const cod=codigoCliente(row);
    const tel=telLimpio(row);
    const f=fechaCorta(row);
    const prods=productosDe(row);

    let pills='';
    for(let n=1;n<=5;n++){
      const on=getVal(row,'VISITA '+n)?'on':'';

function populateFilters(){
  const vSel=document.getElementById('fVendedor'), zSel=document.getElementById('fZona'), mSel=document.getElementById('fMes');
  const altas=[...new Set(allData.map(r=>getVal(r,'Impulsor de mercado')).filter(Boolean))].sort();
  const zonas=[...new Set(allData.map(r=>getVal(r,'Zona')).filter(Boolean))].sort();
  const sinAsignar=allData.filter(r=>!vendedorAsignado(r)).length;

  vSel.innerHTML=`<option value="__all">👤 Todos los que dieron de alta</option>`
    + altas.map(v=>`<option value="v:${esc(v)}">${esc(v)}</option>`).join('');
  zSel.innerHTML=`<option value="__all">📍 Todas las zonas</option>`
    + zonas.map(z=>`<option value="${esc(z)}">${esc(z)}</option>`).join('');

  // Meses presentes en los datos, del más nuevo al más viejo
  const claves=[...new Set(allData.map(mesClave).filter(Boolean))].sort().reverse();
  mSel.innerHTML=`<option value="__all">🗓 Todos los meses</option>`
    + claves.map(k=>`<option value="${k}">${esc(mesEtiqueta(k))} (${allData.filter(r=>mesClave(r)===k).length})</option>`).join('');
  // Arranca en el mes más reciente para que lo viejo no haga ruido
  if(claves.length) mSel.value=claves[0];

  const aSel=document.getElementById('fAsignado');
  const asignados=[...new Set(allData.map(vendedorCorto).filter(Boolean))].sort();
  aSel.innerHTML=`<option value="__all">🎯 Cualquier asignación</option>`
    + asignados.map(v=>`<option value="${esc(v)}">Asignado a ${esc(v)}</option>`).join('');

  const c=document.getElementById('cSin'); if(c) c.textContent=sinAsignar?`(${sinAsignar})`:'';
}

// Clave ordenable aaaa-mm a partir de la marca temporal
function mesClave(row){
  const d=parseFecha(row); if(!d) return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function mesEtiqueta(k){
  const [a,m]=k.split('-');
  return ORDEN_MESES[parseInt(m,10)-1]+' '+a;
}

function applyFilters(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const fv=document.getElementById('fVendedor').value;
  const fz=document.getElementById('fZona').value;
  const ff=document.getElementById('fFecha').value;
  const fm=document.getElementById('fMes').value;
  const fa=document.getElementById('fAsignado').value;
  const orden=document.getElementById('fOrden').value;

  let list=allData.filter(r=>{
    if(q && !Object.values(r).some(v=>String(v).toLowerCase().includes(q))) return false;
    const alta=getVal(r,'Impulsor de mercado');
    const asig=vendedorAsignado(r);
    if(filtroAsig==='__asig'  && !asig) return false;
    if(filtroAsig==='__sin'   && asig)  return false;
    if(filtroAsig==='__seg'   && visitasDe(r)===0) return false;
    if(filtroAsig==='__noseg' && visitasDe(r)>0)   return false;
    if(fv.startsWith('v:') && alta!==fv.slice(2)) return false;
    if(fz!=='__all' && getVal(r,'Zona')!==fz) return false;
    if(fm!=='__all' && mesClave(r)!==fm) return false;
    if(fa!=='__all' && vendedorCorto(r)!==fa) return false;
    if(ff!=='__all' && !esReciente(r, ff)) return false;
    return true;
  });

  const ts=r=>{ const d=parseFecha(r); return d?d.getTime():0; };
  const pr=r=>({Alto:3,Medio:2,Bajo:1}[getPotencial(r)]||0);
  const nm=r=>getVal(r,'Nombre del negocio').toLowerCase();
  const sorters={
    reciente:(a,b)=> ts(b)-ts(a),
    antiguo: (a,b)=> ts(a)-ts(b),
    az:      (a,b)=> nm(a).localeCompare(nm(b)),
    za:      (a,b)=> nm(b).localeCompare(nm(a)),
    vmas:    (a,b)=> visitasDe(b)-visitasDe(a) || ts(b)-ts(a),
    vmenos:  (a,b)=> visitasDe(a)-visitasDe(b) || ts(b)-ts(a),
    potalto: (a,b)=> pr(b)-pr(a) || ts(b)-ts(a),
    zona:    (a,b)=> getVal(a,'Zona').localeCompare(getVal(b,'Zona')) || nm(a).localeCompare(nm(b)),
  };
  if(sorters[orden]) list.sort(sorters[orden]);
  renderListado(list);
}

   ================================================================== */
async function guardar(row, columna, valor, el){
  if(!isBackendOn()){ toast('Falta pegar la URL del Apps Script (ver instrucciones)', 'error'); return false; }
  if(el){ el.disabled=true; }
  try{
    await fetch(CONFIG.WEB_APP_URL, {
      method:'POST',
      mode:'no-cors',                 // clave para que GitHub Pages pueda escribir en Apps Script
      body: JSON.stringify({ row, columna, valor })
    });
    // Con no-cors la respuesta es opaca: asumimos éxito y lo reflejamos en pantalla
    const rec = findByRow(row);
    if(rec){ const key=Object.keys(rec).find(k=>k.trim()===columna) || columna; rec[key]=valor; }
    toast('Guardado ✓', 'ok');
    applyFilters(); if(map) renderMapa(); renderResumen();
    return true;
  }catch(e){
    console.error(e); toast('Sin conexión. Intenta de nuevo.', 'error'); return false;
  }finally{ if(el) el.disabled=false; }
}

async function guardarAsignacion(row, btn){
  const inp=document.getElementById('asig_'+row);
  let val=inp.value.trim();
  // Si escriben solo el nombre, se le antepone "Asignado a "
  if(val && !/^asignad/i.test(val)) val=CONFIG.PREFIJO_ASIGNACION+val;
  btn.disabled=true; const o=btn.innerHTML; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Guardando…';
  const ok=await guardar(row, CONFIG.COL_VENDEDOR, val, null);
  btn.disabled=false; btn.innerHTML=o;
  if(ok){ inp.value=val; showDetail(row); }
}

async function quitarAsignacion(row, btn){
  if(!confirm('¿Quitar la asignación de vendedor de este prospecto?')) return;
  btn.disabled=true;
  const ok=await guardar(row, CONFIG.COL_VENDEDOR, '', null);
  btn.disabled=false;
  if(ok) showDetail(row);
}

async function guardarCita(row, n, inp){
  const col=CONFIG.COL_FECHAS[n-1];
  const ok=await guardar(row, col, inp.value, inp);
  if(ok){ toast(inp.value?`Cita fijada para la visita ${n} ✓`:'Cita borrada','ok'); showDetail(row, n); }

async function limpiarCita(row, n){

async function guardarVisita(row, n, btn){
  const ta = document.getElementById('v'+n+'_'+row);
  const val = ta.value.trim();
  btn.disabled=true; const orig=btn.innerHTML; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Guardando…';

  btn.disabled=false; btn.innerHTML=orig;

/* Dictado por voz (es-MX) */
let recog=null;
function dictar(taId, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Tu navegador no soporta dictado', 'error'); return; }
  if(recog){ recog.stop(); recog=null; btn.classList.remove('rec'); return; }
  recog = new SR(); recog.lang='es-MX'; recog.continuous=true; recog.interimResults=false;
  const ta=document.getElementById(taId);
  btn.classList.add('rec');
  recog.onresult = e=>{ for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal){ ta.value += (ta.value?' ':'') + e.results[i][0].transcript.trim(); } } };
  recog.onend = ()=>{ btn.classList.remove('rec'); recog=null; };
  recog.onerror = ()=>{ btn.classList.remove('rec'); recog=null; };
  recog.start();
}

/* ==================================================================
   CALENDARIO DE AGENDA (fechas AO–AS)
   ================================================================== */
let calMes = new Date().getMonth(), calAnio = new Date().getFullYear();

// Normaliza cualquier fecha a aaaa-mm-dd (acepta dd/mm/aaaa, que es como Sheets suele reexportar)
function isoFecha(s){
  s=String(s||'').trim(); if(!s) return '';
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);
  if(m) return `20${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}

function citasDelRango(){
  // Devuelve [{fecha:'aaaa-mm-dd', row, negocio, visita, vend}]
  const out=[];
  allData.forEach(r=>{
    CONFIG.COL_FECHAS.forEach((col,i)=>{
      const f=isoFecha(getVal(r,col));
      if(f){
        out.push({ fecha:f, row:r._row, negocio:getVal(r,'Nombre del negocio'),
                   visita:i+1, vend:vendedorCorto(r)||getVal(r,'Impulsor de mercado') });
      }
    });
  });
  return out;
}

function cambiarMesCal(d){
  calMes+=d;
  if(calMes<0){ calMes=11; calAnio--; }
  if(calMes>11){ calMes=0; calAnio++; }
  renderCalendario();
}

function renderCalendario(){
  document.getElementById('calTitulo').textContent = `${ORDEN_MESES[calMes]} ${calAnio}`;
  const citas=citasDelRango();
  const porDia={};
  citas.forEach(c=>{
    const [a,m]=c.fecha.split('-').map(n=>parseInt(n,10));
    if(a===calAnio && m===calMes+1){ const d=parseInt(c.fecha.split('-')[2],10); (porDia[d]=porDia[d]||[]).push(c); }
  });

  const primerDia=new Date(calAnio, calMes, 1).getDay();       // 0=Dom
  const diasMes=new Date(calAnio, calMes+1, 0).getDate();
  const hoy=new Date();
  const esMesActual = hoy.getFullYear()===calAnio && hoy.getMonth()===calMes;

  let g=['D','L','M','M','J','V','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<primerDia;i++) g+=`<div class="cal-day empty"></div>`;
  for(let d=1; d<=diasMes; d++){
    const n=(porDia[d]||[]).length;
    const cls=['cal-day']; if(n) cls.push('tiene'); if(esMesActual && d===hoy.getDate()) cls.push('hoy');
    g+=`<div class="${cls.join(' ')}" ${n?`onclick="verDiaCal(${d})"`:''}>${d}${n?`<span class="cd-badge">${n}</span>`:''}</div>`;
  }
  document.getElementById('calGrid').innerHTML=g;

  const totalMes=Object.values(porDia).reduce((s,a)=>s+a.length,0);
  document.getElementById('calDetalle').innerHTML = totalMes
    ? `<p class="pcount">📅 ${totalMes} cita(s) agendada(s) este mes · toca un día resaltado</p>`
    : `<div class="cal-vacio">Sin citas agendadas en ${ORDEN_MESES[calMes]}.<br>Se fijan desde la ficha de cada prospecto, bajo cada visita.</div>`;
  window._calPorDia=porDia;
}

function verDiaCal(d){
  const citas=(window._calPorDia&&window._calPorDia[d])||[];
  const cont=document.getElementById('calDetalle');
  cont.innerHTML=`<p class="pcount">${d} de ${ORDEN_MESES[calMes]} · ${citas.length} cita(s)</p>`
    + citas.map(c=>`<div class="cal-cita" onclick="showDetail(${c.row}, ${c.visita})">
        <div class="neg">${esc(c.negocio)||'Prospecto'}</div>
        <div class="meta"><i class="fas fa-user mr-1"></i>${esc(c.vend)||'—'} · <i class="fas fa-flag-checkered mr-1"></i>Visita ${c.visita}</div>
      </div>`).join('');
  cont.scrollIntoView({behavior:'smooth', block:'start'});
}

window.onload = loadData;
</script>
